apiVersion: agent-platform/v1
kind: Skill
metadata:
  name: translate
  version: 1.0.0
  description: "将考研英语阅读文章翻译为中文，按段落生成中英对照格式"
spec:
  entrypoint: SKILL.md
  capabilities:
    - skill.execute
  permissions:
    filesystem: write
    network: none
    subprocess: none
    git: none
  dependsOn: []
  lifecycle:
    discoverable: true
    deprecated: false
