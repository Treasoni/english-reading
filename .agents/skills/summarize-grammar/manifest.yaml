apiVersion: agent-platform/v1
kind: Skill
metadata:
  name: summarize-grammar
  version: 1.0.0
  description: "读取 intermediate 下所有 grammar-notes.md，按语法类别去重合并"
spec:
  entrypoint: SKILL.md
  capabilities:
    - skill.execute
  permissions:
    filesystem: write
    network: none
    subprocess: none
    git: none
  dependsOn: []
  lifecycle:
    discoverable: true
    deprecated: false
