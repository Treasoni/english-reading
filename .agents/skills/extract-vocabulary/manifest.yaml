apiVersion: agent-platform/v1
kind: Skill
metadata:
  name: extract-vocabulary
  version: 1.0.0
  description: "扫描整合笔记中加粗的生词，提取去重后生成词汇表，替换笔记中的占位符"
spec:
  entrypoint: SKILL.md
  capabilities:
    - skill.execute
  permissions:
    filesystem: write
    network: none
    subprocess: none
    git: none
  dependsOn: []
  lifecycle:
    discoverable: true
    deprecated: false
