apiVersion: agent-platform/v1
kind: Skill
metadata:
  name: compile-note
  version: 1.0.0
  description: "将翻译、排版文章、语法笔记和长难句分析整合为一份全面的综合学习笔记"
spec:
  entrypoint: SKILL.md
  capabilities:
    - skill.execute
  permissions:
    filesystem: write
    network: none
    subprocess: none
    git: none
  dependsOn: []
  lifecycle:
    discoverable: true
    deprecated: false
