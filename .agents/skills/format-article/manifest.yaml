apiVersion: agent-platform/v1
kind: Skill
metadata:
  name: format-article
  version: 1.0.0
  description: "对英文文章进行美化排版，清理原始格式，输出规范的Obsidian Markdown格式"
spec:
  entrypoint: SKILL.md
  capabilities:
    - skill.execute
  permissions:
    filesystem: write
    network: none
    subprocess: none
    git: none
  dependsOn: []
  lifecycle:
    discoverable: true
    deprecated: false
