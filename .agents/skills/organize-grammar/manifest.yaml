apiVersion: agent-platform/v1
kind: Skill
metadata:
  name: organize-grammar
  version: 1.0.0
  description: "整理零散的英语语法笔记，按类别组织为结构化参考"
spec:
  entrypoint: SKILL.md
  capabilities:
    - skill.execute
  permissions:
    filesystem: write
    network: none
    subprocess: none
    git: none
  dependsOn: []
  lifecycle:
    discoverable: true
    deprecated: false
