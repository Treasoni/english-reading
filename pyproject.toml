[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kaoyan-english-reading"
version = "0.1.0"
description = "考研英语阅读真题提取与 Obsidian 精读笔记工作流"
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name = "Kaoyan English Reading" }
]
keywords = ["kaoyan", "english", "reading", "obsidian", "exam"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Topic :: Text Processing :: Markup :: Markdown"
]

[project.scripts]
kaoyan-reading = "kaoyan_reading.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

