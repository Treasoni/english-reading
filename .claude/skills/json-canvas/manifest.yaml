apiVersion: agent-platform/v1
kind: Skill
metadata:
  name: json-canvas
  version: 1.0.0
  description: "Create and edit JSON Canvas files (.canvas) with nodes, edges, groups"
spec:
  entrypoint: SKILL.md
  capabilities:
    - skill.execute
  permissions:
    filesystem: write
    network: none
    subprocess: none
    git: none
  dependsOn: []
  lifecycle:
    discoverable: true
    deprecated: false
