apiVersion: agent-platform/v1
kind: Skill
metadata:
  name: workflow-todo-state
  version: 1.0.0
  description: "Create reusable named workflow state machines for multi-step agent projects"
spec:
  entrypoint: SKILL.md
  capabilities:
    - skill.execute
  permissions:
    filesystem: write
    network: none
    subprocess: none
    git: none
  dependsOn: []
  lifecycle:
    discoverable: true
    deprecated: false
