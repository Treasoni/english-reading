apiVersion: agent-platform/v1
kind: Skill
metadata:
  name: sync-skill-registry
  version: 1.0.0
  description: "扫描 skill-invocation.md 并自动更新技能列表"
spec:
  entrypoint: SKILL.md
  capabilities:
    - skill.execute
  permissions:
    filesystem: write
    network: none
    subprocess: none
    git: none
  dependsOn: []
  lifecycle:
    discoverable: true
    deprecated: false
