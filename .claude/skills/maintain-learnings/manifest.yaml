apiVersion: agent-platform/v1
kind: Skill
metadata:
  name: maintain-learnings
  version: 1.0.0
  description: "维护 .learnings/ 经验库，聚类诊断并追溯修改对应 skill 或规则"
spec:
  entrypoint: SKILL.md
  capabilities:
    - skill.execute
  permissions:
    filesystem: write
    network: none
    subprocess: none
    git: none
  dependsOn: []
  lifecycle:
    discoverable: true
    deprecated: false
