apiVersion: agent-platform/v1
kind: Skill
metadata:
  name: obsidian-markdown
  version: 1.0.0
  description: "Create and edit Obsidian Flavored Markdown with wikilinks, embeds, callouts"
spec:
  entrypoint: SKILL.md
  capabilities:
    - skill.execute
  permissions:
    filesystem: write
    network: none
    subprocess: none
    git: none
  dependsOn: []
  lifecycle:
    discoverable: true
    deprecated: false
