apiVersion: agent-platform/v1
kind: Skill
metadata:
  name: digest
  version: 1.0.0
  description: "自我学习阶段。回顾本次学习会话，记录学习心得和错误到 .learnings/"
spec:
  entrypoint: SKILL.md
  capabilities:
    - skill.execute
  permissions:
    filesystem: write
    network: none
    subprocess: none
    git: none
  dependsOn: []
  lifecycle:
    discoverable: true
    deprecated: false
