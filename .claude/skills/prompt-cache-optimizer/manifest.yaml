apiVersion: agent-platform/v1
kind: Skill
metadata:
  name: prompt-cache-optimizer
  version: 1.0.0
  description: "审计并优化 LLM 提示缓存命中率、输入 token、延迟与调用成本"
spec:
  entrypoint: SKILL.md
  capabilities:
    - skill.execute
  permissions:
    filesystem: read
    network: none
    subprocess: none
    git: none
  dependsOn: []
  lifecycle:
    discoverable: true
    deprecated: false
