apiVersion: agent-platform/v1
kind: Skill
metadata:
  name: defuddle
  version: 1.0.0
  description: "Extract clean markdown content from web pages using Defuddle CLI"
spec:
  entrypoint: SKILL.md
  capabilities:
    - skill.execute
  permissions:
    filesystem: write
    network: allow
    subprocess: none
    git: none
  dependsOn: []
  lifecycle:
    discoverable: true
    deprecated: false
