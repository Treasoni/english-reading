apiVersion: agent-platform/v1
kind: Skill
metadata:
  name: obsidian-cli
  version: 1.0.0
  description: "Interact with Obsidian vaults using the Obsidian CLI"
spec:
  entrypoint: SKILL.md
  capabilities:
    - skill.execute
  permissions:
    filesystem: write
    network: none
    subprocess: allow
    git: none
  dependsOn: []
  lifecycle:
    discoverable: true
    deprecated: false
